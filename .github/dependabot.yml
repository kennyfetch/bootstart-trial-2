# Weekly, grouped updates: one PR per ecosystem instead of one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Node types must match the runtime in .nvmrc (Node 24 LTS). Newer types would accept APIs
      # that fail at runtime. Bump .nvmrc, "engines" and @types/node together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
